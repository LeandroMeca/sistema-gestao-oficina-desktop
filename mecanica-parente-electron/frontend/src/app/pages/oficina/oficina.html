<div class="max-w-4xl mx-auto p-6 bg-white rounded shadow">
  <h2 class="text-xl font-bold mb-4">Configuração da Oficina</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold">Nome</label>
      <input type="text" [(ngModel)]="oficina.nome" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="block text-xs font-bold">Telefone</label>
      <input type="text" [(ngModel)]="oficina.telefone" class="w-full border p-2 rounded" />
    </div>

    <div>
      <label class="block text-xs font-bold">Endereço</label>
      <input type="text" [(ngModel)]="oficina.endereco" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="block text-xs font-bold">Número</label>
      <input type="text" [(ngModel)]="oficina.endereco_numero" class="w-full border p-2 rounded" />
    </div>

    <div>
      <label class="block text-xs font-bold">Bairro</label>
      <input type="text" [(ngModel)]="oficina.bairro" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="block text-xs font-bold">Cidade / UF</label>
      <div class="flex gap-2">
        <input type="text" [(ngModel)]="oficina.cidade" class="w-full border p-2 rounded" />
        <input type="text" [(ngModel)]="oficina.uf" class="w-24 border p-2 rounded" />
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold">CEP</label>
      <input type="text" [(ngModel)]="oficina.cep" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="block text-xs font-bold">Celular</label>
      <input type="text" [(ngModel)]="oficina.celular" class="w-full border p-2 rounded" />
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-bold">Email</label>
      <input type="text" [(ngModel)]="oficina.email" class="w-full border p-2 rounded" />
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-bold">Site</label>
      <input type="text" [(ngModel)]="oficina.site" class="w-full border p-2 rounded" />
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-bold">Especialidades</label>
      <input type="text" [(ngModel)]="oficina.especialidades" class="w-full border p-2 rounded" />
    </div>

    <div class="md:col-span-2">
      <label class="block text-xs font-bold">Observações</label>
      <textarea rows="4" [(ngModel)]="oficina.observacoes" class="w-full border p-2 rounded"></textarea>
    </div>
  </div>

  <div class="mt-4 flex justify-end">
    <button (click)="salvar()" class="px-4 py-2 bg-blue-600 text-white rounded">Salvar Oficina</button>
  </div>
</div>
